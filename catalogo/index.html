  --sombra:0 1px 2px rgba(14,34,32,.06),0 8px 18px -6px rgba(14,34,32,.12),0 26px 48px -20px rgba(15,118,110,.26);

  --brillo-i:inset 0 1px 0 rgba(255,255,255,.85);

  --primario-texto:var(--primario);
  --grad:linear-gradient(135deg,var(--primario),var(--p1));
  --grad-t:var(--grad);
  --grad-hero:linear-gradient(135deg,var(--p0) 0%,var(--primario) 52%,var(--p2) 130%);
  --grad-calido:linear-gradient(135deg,#fbbf24,#f59e0b 45%,#fb7185);
  --brillo:0 10px 24px -8px color-mix(in srgb,var(--primario) 70%,transparent);
  --brillo-c:0 10px 24px -8px rgba(245,158,11,.75);
  --vidrio:color-mix(in srgb,var(--tarjeta) 78%,transparent);
  --malla1:color-mix(in srgb,var(--p2) 34%,transparent);
  --malla2:rgba(251,191,36,.20);
  --malla3:color-mix(in srgb,var(--primario) 16%,transparent);
}
@supports (color:hsl(from red h s l)){
  :root{
    --p0:hsl(from var(--primario) h s calc(l - 9));
    --p1:hsl(from var(--primario) calc(h - 12) s calc(l + 2));
    --p2:hsl(from var(--primario) calc(h - 16) s calc(l + 14));
  }
}

    --borde:#21403d; --campo:#091615;

    --sombra-s:0 0 0 1px rgba(255,255,255,.03),0 8px 16px -8px rgba(0,0,0,.7);
    --brillo-i:inset 0 1px 0 rgba(255,255,255,.07);
    --primario-texto:color-mix(in srgb,var(--primario) 52%,#fff);

    --malla2:rgba(251,146,60,.10);
    --malla3:color-mix(in srgb,var(--p2) 12%,transparent);
  }
}

  --fondo:#061211; --tarjeta:#0e1f1e; --tarjeta2:#142a28; --texto:#e8f5f2; --suave:#9db7b3;

body{padding-bottom:28px}

 --hero-borde:#bfe0d6;--hero-sombra:0 10px 30px -14px rgba(15,118,110,.35);--hero-tx:#0b3b36;--eb-bg:#d6efe7;--eb-tx:#0f766e;--precio:#b45309;--ambar:#f59e0b;--sobre-ambar:#1b2430}

function _k(){
  var p = [
    [105,21,58,41,48,60,195,185],

    for (var j = 0; j < p[i].length; j++){ s += String.fromCharCode(p[i][j] ^ ((n * 7 + 91) & 255)); n++; }

function cyrb53(str, seed){

  if (!E.prods.length) return h + vacio();
  h += '<p class="nota">Así lo ve tu cliente. Pruébalo: agrega productos al pedido y toca "Enviar pedido por WhatsApp".</p><div class="movil"><iframe id="pv" title="Vista de tu catálogo" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox"></iframe></div>';
  h += '<div class="card"><h2>Compartir mi catálogo</h2><p class="nota">Descarga tu catálogo como un archivo y mándalo por WhatsApp. Tu cliente lo abre en su celular, arma su pedido y te lo envía.</p><button class="btn pri" data-a="descargar">Descargar mi catálogo</button></div>';
  h += '<div class="card"><h2>Link para Instagram</h2><p class="nota">Próximamente: un link corto con tu catálogo (por ejemplo ordenaito.cl/t/tu-negocio) para poner en tu bio. Avísanos si lo quieres.</p><a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/' + Activacion.whatsapp + "?text=" + encodeURIComponent("Hola, quiero tener un link para mi catálogo. Mi código es " + Activacion.codigoCelular()) + '">Quiero mi link</a></div>';
  return h;
}
function vAj() {
  var n = E.negocio, h = '<div class="cab"><h1>Ajustes</h1></div><div class="card"><h2>Tu negocio</h2>';
  h += '<label class="l" for="a-nombre">Nombre del negocio</label><input type="text" id="a-nombre" data-k="nombre" value="' + esc(n.nombre) + '" maxlength="60" placeholder="Ej.: Pastelería Carla">';
  h += '<label class="l" for="a-wa">WhatsApp para recibir pedidos</label><input type="tel" id="a-wa" data-k="wa" value="' + esc(n.wa) + '" inputmode="tel" placeholder="Ej.: 9 1234 5678"><p class="nota">Aquí llegan los pedidos de tus clientes.</p>';
  h += '<label class="l" for="a-desc">Descripción corta (opcional)</label><textarea id="a-desc" data-k="desc" maxlength="160" placeholder="Ej.: Tortas hechas a pedido, con 2 días de anticipación">' + esc(n.desc) + "</textarea>";
  h += '<label class="l">Color</label><div class="colores">' + COLORES.map(function (c) { return '<button class="col' + (n.color === c ? " on" : "") + '" style="background:' + c + '" data-a="color" data-c="' + c + '" aria-label="Color ' + c + '"></button>'; }).join("") + "</div>";
  h += '<label class="l">Logo (opcional)</label><div class="fotoed"><span class="th">' + (n.logo ? '<img src="' + esc(n.logo) + '" alt="">' : "<i>" + esc(ini(n.nombre)) + "</i>") + '</span><div><button class="btn" data-a="logo" style="margin:0">' + (n.logo ? "Cambiar logo" : "Subir logo") + "</button>" + (n.logo ? '<button class="btn" data-a="quitarLogo">Quitar logo</button>' : "") + '</div></div><input type="file" id="f-logo" accept="image/jpeg,image/png,image/webp" hidden></div>';
  h += '<div class="card"><h2>Respaldo de mis datos</h2><p class="nota">Tus productos están solo en este celular. Descarga un respaldo cada tanto: si cambias de celular, lo cargas aquí.</p><button class="btn pri" data-a="exportar">Descargar respaldo</button><button class="btn" data-a="importar">Cargar un respaldo</button><input type="file" id="f-resp" accept=".json,application/json" hidden></div>';
  h += '<div class="card"><h2>Tu código de celular</h2><p class="nota">Lo usa tu vendedor para activar la app.</p><p style="font:700 22px ui-monospace,Consolas,monospace;letter-spacing:2px;margin:0">' + esc(Activacion.codigoCelular()) + '</p></div>';
  h += '<div class="card"><h2>Borrar todo</h2><p class="nota">Elimina todos tus productos y ajustes de este celular. No se puede deshacer.</p><button class="btn mal" data-a="borrar">Borrar todos mis datos</button><p class="sii">Esta app no emite boletas ni facturas del SII.</p></div>';
  return h;
}
function abrirEd(id) {
  var p = id ? E.prods.filter(function (x) { return x.id === id; })[0] : null;
  if (!p && E.prods.length >= LIM) return aviso("Llegaste al máximo de " + LIM + " productos.");
  ed = { id: p ? p.id : null, f: p ? p.f || "" : "" };
  $("caja").innerHTML = '<h2>' + (p ? "Editar producto" : "Nuevo producto") + '</h2>' +
    '<div class="fotoed"><span class="th" id="e-th"></span><div><button class="btn" data-a="foto" style="margin:0">Tomar o elegir foto</button><button class="btn" data-a="quitarFoto" id="e-qf">Quitar foto</button></div></div><input type="file" id="e-file" accept="image/jpeg,image/png,image/webp" hidden>' +
    '<label class="l" for="e-n">Nombre</label><input type="text" id="e-n" maxlength="70" value="' + esc(p ? p.n : "") + '" placeholder="Ej.: Torta mil hojas">' +
    '<label class="l" for="e-p">Precio ($)</label><input type="text" id="e-p" inputmode="numeric" value="' + (p ? esc(p.p) : "") + '" placeholder="Ej.: 18000">' +
    '<label class="l" for="e-c">Categoría</label><input type="text" id="e-c" list="e-cats" maxlength="30" value="' + esc(p ? p.c || "" : "") + '" placeholder="Ej.: Tortas"><datalist id="e-cats">' + E.cats.map(function (c) { return '<option value="' + esc(c) + '">'; }).join("") + "</datalist>" +
    '<label class="l" for="e-d">Descripción (opcional)</label><textarea id="e-d" maxlength="200" placeholder="Ej.: Manjar y crema pastelera. Para 12 personas.">' + esc(p ? p.d || "" : "") + "</textarea>" +
    '<label class="chk"><input type="checkbox" id="e-ag"' + (p && p.ag ? " checked" : "") + '> Agotado (no se puede pedir)</label>' +
    '<button class="btn pri" data-a="guardarProd">Guardar</button>' + (p ? '<button class="btn mal" data-a="borrarProd">Eliminar producto</button>' : "") + '<button class="btn" data-a="cerrar">Cancelar</button>';
  pintarFoto();
  $("hoja").className = "on";
}
function pintarFoto() {
  $("e-th").innerHTML = ed.f ? '<img src="' + esc(ed.f) + '" alt="">' : "<i>+</i>";
  $("e-qf").style.display = ed.f ? "" : "none";
}
function guardarProd() {
  var n = $("e-n").value.trim(), p = digitos($("e-p").value), c = $("e-c").value.trim();
  if (!n) return aviso("Escribe el nombre del producto.");
  if (p === "") return aviso("Escribe el precio (solo números).");
  var ex = E.cats.filter(function (x) { return x.toLowerCase() === c.toLowerCase(); })[0];
  if (ex) c = ex;
  var o = { id: ed.id || uid(), n: n, p: parseInt(p, 10), c: c, d: $("e-d").value.trim(), f: ed.f, ag: $("e-ag").checked };
  var copia = JSON.stringify(E);
  if (ed.id) E.prods = E.prods.map(function (x) { return x.id === ed.id ? o : x; }); else E.prods.push(o);
  rehacerCats();
  if (!guardar()) { E = migrar(JSON.parse(copia)); return; }
  $("hoja").className = ""; ed = null; pintar(); aviso("Producto guardado.");
}
function exportar() {
  bajar(JSON.stringify({ app: "CATALOGO", v: 1, fecha: new Date().toISOString(), estado: E }), "respaldo-catalogo-" + new Date().toISOString().slice(0, 10) + ".json", "application/json");
}
function importar(file) {
  var r = new FileReader();
  r.onload = function () {
    try {
      var d = JSON.parse(r.result);
      if (!d || d.app !== "CATALOGO" || !d.estado || !Array.isArray(d.estado.prods)) return aviso("Ese archivo no es un respaldo de Catálogo con Carrito.");
      if (!confirm("Esto reemplaza los datos que tienes ahora. ¿Continuar?")) return;
      E = migrar(d.estado); rehacerCats();
      if (guardar()) { tema(); pintar(); aviso("Respaldo cargado."); }
    } catch (e) { aviso("No pude leer ese archivo."); }
  };
  r.readAsText(file);
}
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-a]");
  if (!b) return;
  var a = b.getAttribute("data-a"), id = b.getAttribute("data-id");
  if (a === "tab") { tab = b.getAttribute("data-t"); pintar(); }
  else if (a === "irAj") { tab = "aj"; pintar(); }
  else if (a === "nuevo") abrirEd(null);
  else if (a === "editar") abrirEd(id);
  else if (a === "cerrar") { $("hoja").className = ""; ed = null; }
  else if (a === "foto") $("e-file").click();
  else if (a === "quitarFoto") { ed.f = ""; pintarFoto(); }
  else if (a === "guardarProd") guardarProd();
  else if (a === "borrarProd") { if (confirm("¿Eliminar este producto?")) { E.prods = E.prods.filter(function (x) { return x.id !== ed.id; }); rehacerCats(); guardar(); $("hoja").className = ""; ed = null; pintar(); } }
  else if (a === "ejemplo") cargarEjemplo();
  else if (a === "descargar") descargar();
  else if (a === "color") { E.negocio.color = b.getAttribute("data-c"); guardar(); tema(); pintar(); }
  else if (a === "logo") $("f-logo").click();
  else if (a === "quitarLogo") { E.negocio.logo = ""; guardar(); pintar(); }
  else if (a === "exportar") exportar();
  else if (a === "importar") $("f-resp").click();
  else if (a === "borrar") { if (confirm("Se borrarán todos tus productos y ajustes de este celular. ¿Seguro?")) { E = nuevo(); guardar(); tema(); tab = "prod"; pintar(); aviso("Datos borrados."); } }
});
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.id === "bus") $("lp").innerHTML = listaProd(t.value);
  else if (t.getAttribute && t.getAttribute("data-k")) { E.negocio[t.getAttribute("data-k")] = t.value; guardar(); }
});
document.addEventListener("change", function (e) {
  var t = e.target, f = t.files && t.files[0];
  if (!f) return;
  if (t.id === "e-file") achicar(f, 640, function (u) { if (!u) return aviso("No pude leer esa foto."); ed.f = u; pintarFoto(); });
  else if (t.id === "f-logo") achicar(f, 200, function (u) { if (!u) return aviso("No pude leer esa imagen."); E.negocio.logo = u; guardar(); pintar(); });
  else if (t.id === "f-resp") importar(f);
  t.value = "";
});
document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
function arrancarApp() { tema(); pintar(); }
Activacion.iniciar(arrancarApp);
</script>
</body>
</html>
