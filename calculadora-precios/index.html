<script>
"use strict";
var UNIDADES = {
  kg:{f:'masa',k:1000}, g:{f:'masa',k:1},
  L:{f:'vol',k:1000},  ml:{f:'vol',k:1},
  unidad:{f:'u',k:1},
  m:{f:'largo',k:100}, cm:{f:'largo',k:1}
};
var IVA = 0.19;
function aNum(v){
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  var s = String(v == null ? '' : v).replace(/[^\d.,\-]/g,'');
  if (!s) return 0;
  var neg = s.charAt(0) === '-';
  s = s.replace(/-/g,'');
  var tienePunto = s.indexOf('.') >= 0, tieneComa = s.indexOf(',') >= 0;
  if (tienePunto && tieneComa){
    s = s.replace(/\./g,'').replace(',','.');
  } else if (tieneComa){
    s = s.replace(/,/g,'.');
  } else if (tienePunto){
    if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  }
  var n = parseFloat(s);
  if (!isFinite(n)) return 0;
  return neg ? -n : n;
}
function costoInsumo(i){
  var precio = aNum(i.precio), comprada = aNum(i.cantCompra), usada = aNum(i.cantUsada);
  var uc = UNIDADES[i.uCompra], uu = UNIDADES[i.uUsada];
  if (!(precio > 0) && !(usada > 0)) return {costo:0, aviso:''};
  if (!uc || !uu || uc.f !== uu.f) return {costo:0, aviso:'Las unidades no son compatibles (usa kg con g, L con ml, m con cm).'};
  if (!(comprada > 0)) return {costo:0, aviso:'Falta la cantidad comprada (no puede ser 0).'};
  var costo = precio * ((usada * uu.k) / (comprada * uc.k));
  return {costo:costo, aviso:''};
}
function redondear(precio, modo){
  if (!isFinite(precio) || precio <= 0) return 0;
  if (modo === 'centena') return Math.ceil(precio / 100 - 1e-9) * 100;
  if (modo === '990'){
    if (precio <= 990) return 990;
    return Math.ceil((precio - 990) / 1000 - 1e-9) * 1000 + 990;
  }
  return Math.round(precio);
}
function totalGastosFijos(aj){
  return (aj.gastosFijos || []).reduce(function(a,g){ return a + aNum(g.monto); }, 0);
}
function calcular(p, aj){
  var r = {ok:true, errores:[], avisos:[], precioOk:true};
  var rend = aNum(p.rendimiento);
  var insumosTanda = 0;
  (p.insumos || []).forEach(function(i){
    var c = costoInsumo(i);
    insumosTanda += c.costo;
    if (c.aviso) r.avisos.push((i.nombre || 'Un insumo') + ': ' + c.aviso);
  });
  r.insumosTanda = insumosTanda;
  if (!(rend > 0)){
    r.ok = false;
    r.errores.push('Indica cuántas unidades salen de la tanda (mínimo 1).');
    return r;
  }
  var valorHora = (p.valorHora === null || p.valorHora === undefined || p.valorHora === '') ? aNum(aj.valorHora) : aNum(p.valorHora);
  r.insumosU = insumosTanda / rend;
  r.envaseU  = aNum(p.envase);
  r.manoObraU = (aNum(p.horas) * valorHora) / rend;
  r.fijosU = 0;
  if (p.incluirFijos){
    var tf = totalGastosFijos(aj), um = aNum(aj.unidadesMes);
    if (um > 0) r.fijosU = tf / um;
    else if (tf > 0) r.avisos.push('Gastos fijos: anota en Ajustes cuántas unidades vendes al mes (no puede ser 0).');
  }
  r.costo = r.insumosU + r.envaseU + r.manoObraU + r.fijosU;
  r.rend = rend;
  var m = aNum(p.margen) / 100, c = aNum(p.comision) / 100;
  r.m = m; r.c = c;
  var den = 1 - m - c;
  if (den <= 0.0001){
    r.precioOk = false;
    r.errores.push('El margen y la comisión suman 100% o más: no hay precio posible. Baja el margen o la comisión.');
    return r;
  }
  r.neto = r.costo / den;
  var bruto = p.iva ? r.neto * (1 + IVA) : r.neto;
  r.precio = redondear(bruto, p.redondeo);
  var netoReal = p.iva ? r.precio / (1 + IVA) : r.precio;
  r.netoReal = netoReal;
  r.ivaU = r.precio - netoReal;
  r.comisionU = netoReal * c;
  r.ganancia = netoReal - r.comisionU - r.costo;
  r.margenReal = netoReal > 0 ? r.ganancia / netoReal : 0;
  r.gananciaTanda = r.ganancia * rend;
  return r;
}
function evaluarPrecio(precio, costo, p){
  var c = aNum(p.comision) / 100;
  var neto = p.iva ? precio / (1 + IVA) : precio;
  var gan = neto * (1 - c) - costo;
  return {ganancia:gan, margen: neto > 0 ? gan / neto : 0};
}
var nf = new Intl.NumberFormat('es-CL', {maximumFractionDigits:0});

  p.rendimiento = 24; p.envase = 50; p.horas = 1.5; p.incluirFijos = true;

function normalizar(d){
  var base = ajustesBase();
  var o = {version:1, ajustes:Object.assign({}, base, (d && d.ajustes) || {}), productos:[], bienvenida:!!(d && d.bienvenida)};
  if (!Array.isArray(o.ajustes.gastosFijos)) o.ajustes.gastosFijos = [];

  ((d && d.productos) || []).forEach(function(p){
    var v = Object.assign(productoVacio(), p);
    v.insumos = Array.isArray(p.insumos) ? p.insumos.map(function(i){ return Object.assign(insumoVacio(), i); }) : [];

function aplicarColor(){

  if (el.dataset && el.dataset.f === 'margen' && el.type === 'text') el.value = aTexto(buscarProducto(prodActual).margen);
});
window.addEventListener('pagehide', guardarYa);
document.addEventListener('visibilitychange', function(){ if (document.hidden) guardarYa(); });
function arrancarApp(){
  estado = cargar();
  if (!guardadoOk) document.getElementById('avisoGuardado').style.display = 'block';
  aplicarColor();
  aplicarNegocio();
  ir('lista');
  try { if (!localStorage.getItem(CLAVE)) guardarYa(); } catch(e){ guardadoOk = false; document.getElementById('avisoGuardado').style.display = 'block'; }
}
Activacion.iniciar(arrancarApp);
</script>
