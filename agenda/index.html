<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<title>Agenda de Horas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eef6f5">
<meta name="description" content="Agenda de horas para peluquerías, barberías y manicure. Funciona sin internet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda de Horas">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='114' fill='%230f766e'/%3E%3Cg transform='translate(86 86) scale(3.4)'%3E%3Cpath d='M40 8 H60 A32 32 0 0 1 92 40 V50 C92 64 93 78 91 90 C90 94.5 86 95 82 91.5 C76 86 69 80 60 80 H40 A32 32 0 0 1 8 48 V40 A32 32 0 0 1 40 8 Z' fill='%23ffffff'/%3E%3Crect x='27.8' y='31.8' width='12.4' height='12.4' rx='3.8' fill='%230f766e'/%3E%3Cpath d='M61.69 43.3 L68.31 32.7' fill='none' stroke='%23f59e0b' stroke-width='10.5' stroke-linecap='round'/%3E%3Cpath d='M31 54 Q50 73 69 54' fill='none' stroke='%23f59e0b' stroke-width='8.5' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --primario:#0f766e; --sobre-primario:#ffffff;
  --p0:color-mix(in srgb,var(--primario) 78%,#000);
  --p1:color-mix(in srgb,var(--primario) 88%,#4ade80);
  --p2:color-mix(in srgb,var(--primario) 60%,#5eead4);
  --acento2:var(--p1);
  --ambar:#f59e0b; --coral:#fb7185;
  --fondo:#eef6f5; --tarjeta:#ffffff; --tarjeta2:#f1f7f6; --texto:#0e2220; --suave:#4b605d;
  --borde:#d3e3e0; --campo:#ffffff;
  --ok:#0b7a43; --ok-fondo:#d9f5e5; --aviso:#8a5200; --aviso-fondo:#fdeec6; --mal:#b42318; --mal-fondo:#fde2df;
  --sombra:0 1px 2px rgba(14,34,32,.06),0 8px 18px -6px rgba(14,34,32,.12),0 26px 48px -20px rgba(15,118,110,.26);
  --sombra-s:0 1px 2px rgba(14,34,32,.08),0 8px 16px -8px rgba(14,34,32,.20);
  --brillo-i:inset 0 1px 0 rgba(255,255,255,.85);
  --radio:26px;
  --primario-texto:var(--primario);
  --grad:linear-gradient(135deg,var(--primario),var(--p1));
  --grad-t:var(--grad);
  --grad-hero:linear-gradient(135deg,var(--p0) 0%,var(--primario) 52%,var(--p2) 130%);
  --grad-calido:linear-gradient(135deg,#fbbf24,#f59e0b 45%,#fb7185);
  --brillo:0 10px 24px -8px color-mix(in srgb,var(--primario) 70%,transparent);
  --brillo-c:0 10px 24px -8px rgba(245,158,11,.75);
  --vidrio:color-mix(in srgb,var(--tarjeta) 78%,transparent);
  --malla1:color-mix(in srgb,var(--p2) 34%,transparent);
  --malla2:rgba(251,191,36,.20);
  --malla3:color-mix(in srgb,var(--primario) 16%,transparent);
}
@supports (color:hsl(from red h s l)){
  :root{
    --p0:hsl(from var(--primario) h s calc(l - 9));
    --p1:hsl(from var(--primario) calc(h - 12) s calc(l + 2));
    --p2:hsl(from var(--primario) calc(h - 16) s calc(l + 14));
  }
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --fondo:#061211; --tarjeta:#0e1f1e; --tarjeta2:#142a28; --texto:#e8f5f2; --suave:#9db7b3;
    --borde:#21403d; --campo:#091615;
    --ok:#5ee9a0; --ok-fondo:#0f3a27; --aviso:#fcd34d; --aviso-fondo:#3d2f08; --mal:#ff9a92; --mal-fondo:#46171a;
    --sombra:0 0 0 1px rgba(255,255,255,.03),0 10px 22px -8px rgba(0,0,0,.65),0 28px 52px -22px rgba(0,0,0,.8);
    --sombra-s:0 0 0 1px rgba(255,255,255,.03),0 8px 16px -8px rgba(0,0,0,.7);
    --brillo-i:inset 0 1px 0 rgba(255,255,255,.07);
    --primario-texto:color-mix(in srgb,var(--primario) 52%,#fff);
    --grad-t:linear-gradient(135deg,color-mix(in srgb,var(--primario) 45%,#fff),color-mix(in srgb,var(--p2) 55%,#fde68a));
    --malla1:color-mix(in srgb,var(--primario) 38%,transparent);
    --malla2:rgba(251,146,60,.10);
    --malla3:color-mix(in srgb,var(--p2) 12%,transparent);
  }
}
:root[data-tema="oscuro"]{
  --fondo:#061211; --tarjeta:#0e1f1e; --tarjeta2:#142a28; --texto:#e8f5f2; --suave:#9db7b3;
  --borde:#21403d; --campo:#091615;
  --ok:#5ee9a0; --ok-fondo:#0f3a27; --aviso:#fcd34d; --aviso-fondo:#3d2f08; --mal:#ff9a92; --mal-fondo:#46171a;
  --sombra:0 0 0 1px rgba(255,255,255,.03),0 10px 22px -8px rgba(0,0,0,.65),0 28px 52px -22px rgba(0,0,0,.8);
  --sombra-s:0 0 0 1px rgba(255,255,255,.03),0 8px 16px -8px rgba(0,0,0,.7);
  --brillo-i:inset 0 1px 0 rgba(255,255,255,.07);
  --primario-texto:color-mix(in srgb,var(--primario) 52%,#fff);
  --grad-t:linear-gradient(135deg,color-mix(in srgb,var(--primario) 45%,#fff),color-mix(in srgb,var(--p2) 55%,#fde68a));
  --malla1:color-mix(in srgb,var(--primario) 38%,transparent);
  --malla2:rgba(251,146,60,.10);
  --malla3:color-mix(in srgb,var(--p2) 12%,transparent);
}
html{color-scheme:light dark;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
:root[data-tema="claro"]{color-scheme:light}
:root[data-tema="oscuro"]{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(120% 60% at 100% -10%,color-mix(in srgb,var(--primario) 26%,transparent),transparent 60%),radial-gradient(90% 50% at -10% 30%,color-mix(in srgb,var(--acento2) 18%,transparent),transparent 60%),var(--fondo);background-attachment:fixed;color:var(--texto);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
body.sin-scroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--fondo) 72%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--primario) 25%,var(--borde));padding-top:env(safe-area-inset-top)}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px}
.logo{height:36px;width:36px;border-radius:10px;object-fit:cover;flex:none}
.marca{flex:1;min-width:0}
.marca b{display:block;font-size:18px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.marca small{color:var(--suave);font-size:12px}
.plan{min-height:44px;padding:0 14px;border-radius:22px;border:0;background:var(--grad);color:var(--sobre-primario);box-shadow:var(--brillo);font-weight:700;font-size:13px;cursor:pointer}
.plan.full{background:var(--tarjeta2);color:var(--suave);box-shadow:none;border:1px solid var(--borde);cursor:default}
main.wrap{padding-top:14px;padding-bottom:110px}
.card{background:var(--vidrio);border:1px solid color-mix(in srgb,var(--primario) 16%,var(--borde));border-radius:var(--radio);padding:14px;margin-bottom:12px;box-shadow:var(--sombra)}
.card h2{font-size:17px;margin-bottom:4px}
.card h3{font-size:15px;margin:12px 0 6px}
.nota{color:var(--suave);font-size:14px;margin:2px 0 8px}
label.l{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input[type=text],input[type=password],input[type=search],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:46px;border:1px solid var(--borde);background:var(--campo);border-radius:12px;padding:8px 12px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--primario) 50%,transparent);outline-offset:1px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--borde);background:var(--tarjeta2);cursor:pointer;font-weight:600;text-decoration:none;text-align:center}
.btn.pri{background:var(--grad);color:var(--sobre-primario);border-color:transparent;box-shadow:var(--brillo)}
.btn.mal{color:var(--mal);border-color:var(--mal);background:transparent}
.btn.wa{background:linear-gradient(135deg,#25d366,#0fa86a);border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(37,211,102,.35)}
.btn.out{background:transparent;border:2px solid var(--primario);color:var(--primario-texto)}
.btn.block{width:100%}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acciones .btn{flex:1;min-width:140px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--borde);background:var(--tarjeta);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.sel{background:var(--grad);color:var(--sobre-primario);border-color:transparent;box-shadow:var(--brillo)}
.chip .pt{width:10px;height:10px;border-radius:50%;flex:none}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.seg{display:flex;background:var(--tarjeta);border:1px solid var(--borde);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;cursor:pointer;font-weight:600;color:var(--suave)}
.seg button.sel{background:var(--grad);color:var(--sobre-primario);box-shadow:var(--brillo)}
.vacio{text-align:center;color:var(--suave);padding:26px 10px}
.alerta{border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:600;font-size:15px}
.alerta.mal{background:var(--mal-fondo);color:var(--mal)}
.alerta.aviso{background:var(--aviso-fondo);color:var(--aviso)}
.alerta.ok{background:var(--ok-fondo);color:var(--ok)}
.alerta small{display:block;font-weight:400;margin-top:2px}
.sw{display:flex;align-items:center;gap:12px;min-height:46px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .pista{flex:none;width:50px;height:30px;border-radius:15px;background:var(--borde);position:relative;transition:.15s}
.sw .pista::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked + .pista{background:var(--primario)}
.sw input:checked + .pista::after{left:23px}
.sw input:focus-visible + .pista{outline:3px solid color-mix(in srgb,var(--primario) 50%,transparent)}
.sw span.t{flex:1;font-weight:600}
.fecha-barra{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.flecha{flex:none;width:46px;height:46px;border-radius:14px;border:1px solid var(--borde);background:var(--tarjeta);font-size:22px;cursor:pointer;line-height:1}
.fecha-tit{flex:1;position:relative;text-align:center;min-height:46px;display:flex;flex-direction:column;justify-content:center;border-radius:14px}
.fecha-tit b{font-size:22px;line-height:1.1}
.fecha-tit small{color:var(--suave);font-size:13px}
.fecha-tit input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.fila-acc{display:flex;gap:8px;margin-bottom:10px;align-items:stretch}
.fila-acc .seg{flex:1}
.fila-acc .btn{flex:none;padding:0 14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--vidrio);border:1px solid color-mix(in srgb,var(--primario) 16%,var(--borde));border-radius:14px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:800;line-height:1.2;overflow-wrap:anywhere;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.dato2{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--borde)}.dato2:last-child{border:0}.dato2 span:first-child{color:var(--suave)}
.stat small{color:var(--suave);font-size:12px}
.stat.cob b{background:linear-gradient(135deg,#4ade80,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.siguiente{display:block;width:100%;text-align:left;border:0;border-radius:16px;padding:12px 14px;margin-bottom:10px;background:var(--grad);color:var(--sobre-primario);box-shadow:var(--brillo);cursor:pointer;min-height:64px}
.siguiente small{display:block;font-weight:700;opacity:.85;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.siguiente b{display:block;font-size:18px}
.siguiente span{display:block;opacity:.85;font-size:14px}
.cf{position:fixed;top:-30px;z-index:95;pointer-events:none;font-size:22px;animation:caer 1.4s ease-in forwards}
@keyframes caer{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.cf{display:none}}
.cierre{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 30%,var(--tarjeta)),color-mix(in srgb,#22d3ee 18%,var(--tarjeta)));border:1px solid color-mix(in srgb,var(--ok) 40%,var(--borde));border-radius:16px;padding:12px 14px;margin-bottom:10px}
.cierre b{display:block;font-size:17px}
.cierre small{display:block;color:var(--suave);margin-top:2px}
.pasos{margin:8px 0 0;padding:0;list-style:none;counter-reset:p}
.pasos li{counter-increment:p;position:relative;padding:8px 0 8px 44px;min-height:44px}
.pasos li::before{content:counter(p);position:absolute;left:0;top:6px;width:32px;height:32px;border-radius:50%;background:var(--grad);color:var(--sobre-primario);font-weight:800;display:flex;align-items:center;justify-content:center}
.pasos li b{display:block}
.pasos li span{color:var(--suave);font-size:14px}
.total{display:flex;justify-content:space-between;align-items:center;font-size:18px;margin:14px 0 4px;padding:12px 14px;border-radius:14px;background:var(--tarjeta2)}
.total b{font-size:24px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.iconos{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.iconos button{min-height:44px;border-radius:12px;border:1px solid var(--borde);background:var(--tarjeta);font-size:22px;cursor:pointer}
.iconos button.sel{background:var(--grad);border-color:transparent}
.tl-caja{background:var(--vidrio);border:1px solid color-mix(in srgb,var(--primario) 16%,var(--borde));box-shadow:var(--sombra);border-radius:var(--radio);padding:12px 10px 12px 0;overflow:hidden}
.tl{position:relative;margin-left:52px}
.tl .h{position:absolute;left:-50px;width:44px;text-align:right;font-size:12px;color:var(--suave);transform:translateY(-8px)}
.tl .ln{position:absolute;left:0;right:0;border-top:1px solid var(--borde)}
.tl .ln.m{border-top-style:dashed;opacity:.5}
.tl .cerrado{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--borde) 55%,transparent) 8px 9px);opacity:.7;pointer-events:none}
.tl .ahora{position:absolute;left:-6px;right:0;border-top:2px solid var(--mal);z-index:3;pointer-events:none}
.tl .ahora::before{content:"";position:absolute;left:0;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--mal)}
.tl .libre{position:absolute;left:0;right:0;cursor:pointer}
.cita{position:absolute;border-radius:10px;padding:3px 8px;overflow:hidden;border:0;border-left:5px solid var(--pc);background:linear-gradient(135deg,color-mix(in srgb,var(--pc) 42%,var(--tarjeta)),color-mix(in srgb,var(--pc) 16%,var(--tarjeta)));box-shadow:0 3px 12px color-mix(in srgb,var(--pc) 30%,transparent);cursor:pointer;text-align:left;z-index:2;font-size:13px;line-height:1.25;color:var(--texto);min-height:26px}
.cita b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cita span{display:block;color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cita.hecha{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 38%,var(--tarjeta)),color-mix(in srgb,var(--ok) 12%,var(--tarjeta)));border-left-color:var(--ok);box-shadow:0 3px 12px color-mix(in srgb,var(--ok) 28%,transparent)}
.cita.novino{opacity:.5;text-decoration:line-through}
.cita.blq{background:repeating-linear-gradient(135deg,var(--tarjeta2) 0 8px,var(--tarjeta) 8px 16px);border-left-color:var(--suave);box-shadow:none}
.cita b span.ok{display:inline;color:var(--ok);font-weight:800}
.semana .dia{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;text-align:left;background:var(--vidrio);border:1px solid var(--borde);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.semana .dia.hoy{border-color:var(--primario);box-shadow:var(--brillo)}
.semana .dia.cerr{opacity:.55}
.semana .num{flex:none;width:48px;text-align:center}
.semana .num b{display:block;font-size:22px;line-height:1.1}
.semana .num small{color:var(--suave);font-size:12px;text-transform:capitalize}
.semana .info{flex:1;min-width:0}
.semana .info b{display:block}
.semana .info small{color:var(--suave)}
.barra{height:6px;border-radius:3px;background:var(--borde);margin-top:6px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--grad);border-radius:3px}
.recobj{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,color-mix(in srgb,var(--primario) 28%,var(--tarjeta)),color-mix(in srgb,var(--acento2) 18%,var(--tarjeta)));color:var(--texto);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-weight:600}
.recobj span{flex:1}
.recobj .btn{min-height:44px;padding:0 12px;background:var(--grad);color:var(--sobre-primario);border-color:transparent}
.fila{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;text-align:left;background:var(--vidrio);border:1px solid var(--borde);border-radius:14px;padding:8px 12px;margin-bottom:8px;cursor:pointer}
.fila .av{flex:none;width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--pc,var(--primario)),color-mix(in srgb,var(--pc,var(--primario)) 50%,#ff2d95));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--texto)}
.fila .tx{flex:1;min-width:0}
.fila .tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .tx small{display:block;color:var(--suave);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .der{flex:none;font-weight:700}
.fila .wa-mini{flex:none;min-width:46px;min-height:46px;border-radius:12px;background:#1fa855;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700;font-size:13px;padding:0 10px}
.cabeza{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cabeza h1{flex:1;font-size:22px}
.meter{height:8px;border-radius:4px;background:var(--borde);overflow:hidden;margin:4px 0 10px}
.meter i{display:block;height:100%;background:var(--grad)}
.horario .fila-h{display:grid;grid-template-columns:96px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.horario .fila-h.off input[type=time]{opacity:.4}
.colores{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.col.sel{border-color:var(--texto)}
input[type=color]{width:44px;height:44px;padding:0;border:1px solid var(--borde);border-radius:50%;background:none;cursor:pointer;overflow:hidden}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}

function cargarLogo(file){

  img.onload = function(){
    var t = 256, esc_ = Math.min(1, t / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * esc_); c.height = Math.round(img.height * esc_);

    E.negocio.logo = c.toDataURL(file.type === "image/png" ? "image/png" : "image/jpeg", 0.85);
