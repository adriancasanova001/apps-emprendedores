<style>
:root{
  --primario:#0f766e; --sobre-primario:#ffffff;
  --p0:color-mix(in srgb,var(--primario) 78%,#000);
  --p1:color-mix(in srgb,var(--primario) 88%,#4ade80);
  --p2:color-mix(in srgb,var(--primario) 60%,#5eead4);
  --ambar:#f59e0b; --coral:#fb7185;
  --fondo:#eef6f5; --tarjeta:#ffffff; --tarjeta2:#f1f7f6; --texto:#0e2220; --suave:#4b605d;
  --borde:#d3e3e0; --campo:#ffffff;
  --ok:#0b7a43; --ok-fondo:#d9f5e5; --aviso:#8a5200; --aviso-fondo:#fdeec6; --mal:#b42318; --mal-fondo:#fde2df;
  --sombra:0 1px 2px rgba(14,34,32,.06),0 8px 18px -6px rgba(14,34,32,.12),0 26px 48px -20px rgba(15,118,110,.26);
  --sombra-s:0 1px 2px rgba(14,34,32,.08),0 8px 16px -8px rgba(14,34,32,.20);
  --brillo-i:inset 0 1px 0 rgba(255,255,255,.85);
  --radio:26px;
  --primario-texto:var(--primario);
  --grad:linear-gradient(135deg,var(--primario),var(--p1));
  --grad-t:var(--grad);
  --grad-hero:linear-gradient(135deg,var(--p0) 0%,var(--primario) 52%,var(--p2) 130%);
  --grad-calido:linear-gradient(135deg,#fbbf24,#f59e0b 45%,#fb7185);
  --brillo:0 10px 24px -8px color-mix(in srgb,var(--primario) 70%,transparent);
  --brillo-c:0 10px 24px -8px rgba(245,158,11,.75);
  --vidrio:color-mix(in srgb,var(--tarjeta) 78%,transparent);
  --malla1:color-mix(in srgb,var(--p2) 34%,transparent);
  --malla2:rgba(251,191,36,.20);
  --malla3:color-mix(in srgb,var(--primario) 16%,transparent);
}
@supports (color:hsl(from red h s l)){
  :root{
    --p0:hsl(from var(--primario) h s calc(l - 9));
    --p1:hsl(from var(--primario) calc(h - 12) s calc(l + 2));
    --p2:hsl(from var(--primario) calc(h - 16) s calc(l + 14));
  }
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --fondo:#061211; --tarjeta:#0e1f1e; --tarjeta2:#142a28; --texto:#e8f5f2; --suave:#9db7b3;
    --borde:#21403d; --campo:#091615;
    --ok:#5ee9a0; --ok-fondo:#0f3a27; --aviso:#fcd34d; --aviso-fondo:#3d2f08; --mal:#ff9a92; --mal-fondo:#46171a;
    --sombra:0 0 0 1px rgba(255,255,255,.03),0 10px 22px -8px rgba(0,0,0,.65),0 28px 52px -22px rgba(0,0,0,.8);
    --sombra-s:0 0 0 1px rgba(255,255,255,.03),0 8px 16px -8px rgba(0,0,0,.7);
    --brillo-i:inset 0 1px 0 rgba(255,255,255,.07);
    --primario-texto:color-mix(in srgb,var(--primario) 52%,#fff);
    --grad-t:linear-gradient(135deg,color-mix(in srgb,var(--primario) 45%,#fff),color-mix(in srgb,var(--p2) 55%,#fde68a));
    --malla1:color-mix(in srgb,var(--primario) 38%,transparent);
    --malla2:rgba(251,146,60,.10);
    --malla3:color-mix(in srgb,var(--p2) 12%,transparent);
  }
}
:root[data-tema="oscuro"]{
  --fondo:#061211; --tarjeta:#0e1f1e; --tarjeta2:#142a28; --texto:#e8f5f2; --suave:#9db7b3;
  --borde:#21403d; --campo:#091615;
  --ok:#5ee9a0; --ok-fondo:#0f3a27; --aviso:#fcd34d; --aviso-fondo:#3d2f08; --mal:#ff9a92; --mal-fondo:#46171a;
  --sombra:0 0 0 1px rgba(255,255,255,.03),0 10px 22px -8px rgba(0,0,0,.65),0 28px 52px -22px rgba(0,0,0,.8);
  --sombra-s:0 0 0 1px rgba(255,255,255,.03),0 8px 16px -8px rgba(0,0,0,.7);
  --brillo-i:inset 0 1px 0 rgba(255,255,255,.07);
  --primario-texto:color-mix(in srgb,var(--primario) 52%,#fff);
  --grad-t:linear-gradient(135deg,color-mix(in srgb,var(--primario) 45%,#fff),color-mix(in srgb,var(--p2) 55%,#fde68a));
  --malla1:color-mix(in srgb,var(--primario) 38%,transparent);
  --malla2:rgba(251,146,60,.10);
  --malla3:color-mix(in srgb,var(--p2) 12%,transparent);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;color-scheme:light dark}
:root[data-tema="claro"]{color-scheme:light}
:root[data-tema="oscuro"]{color-scheme:dark}
body{margin:0;background:var(--fondo);color:var(--texto);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  padding-bottom:env(safe-area-inset-bottom);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 38% at 104% -4%,var(--malla1),transparent 72%),
    radial-gradient(52% 34% at -8% 30%,var(--malla2),transparent 72%),
    radial-gradient(70% 40% at 60% 108%,var(--malla3),transparent 72%)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{letter-spacing:-.015em}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.g{width:24px;height:24px}
.ilus{display:block;flex:none}
header.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--fondo) 70%,transparent);
  -webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  border-bottom:1px solid color-mix(in srgb,var(--primario) 18%,var(--borde))}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:60px;padding-top:6px;padding-bottom:6px}
.logo{max-height:36px;width:auto;max-width:96px;object-fit:contain;border-radius:10px;flex:none}
.marca-ic{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:var(--brillo),var(--brillo-i)}
.marca{flex:1;min-width:0}
.marca b{display:block;font-size:17px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--grad-t);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.02em}
.marca small{display:block;color:var(--suave);font-size:12px;line-height:1.25}
.marca small .lnk{background:none;border:0;padding:10px 0;margin:-10px 0;min-height:44px;color:var(--primario-texto);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;text-align:left}
.nav{display:flex;gap:4px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--tarjeta) 70%,transparent);border:1px solid var(--borde);box-shadow:var(--sombra-s)}
.nav button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 13px;border:0;border-radius:999px;background:transparent;color:var(--suave);font-weight:700;font-size:13.5px;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
.nav button .ic{width:18px;height:18px}
.nav button.act{background:var(--grad);color:var(--sobre-primario);box-shadow:var(--brillo)}
@media (max-width:420px){ .marca-ic.def{display:none} .nav button .ic{display:none} .nav button{padding:0 12px} }
main.wrap{padding-top:18px;padding-bottom:170px}
.vista{display:none}
.vista.act{display:block}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.entra .card,.entra .prod,.entra .hero,.entra .kpi{animation:subir .5s cubic-bezier(.2,.8,.2,1) both}
.entra .prod:nth-child(2),.entra .kpi:nth-child(2){animation-delay:.06s}
.entra .prod:nth-child(3),.entra .kpi:nth-child(3){animation-delay:.12s}
.entra .prod:nth-child(n+4){animation-delay:.18s}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
.card{position:relative;background:var(--tarjeta);border:1px solid color-mix(in srgb,var(--primario) 12%,var(--borde));border-radius:var(--radio);
  box-shadow:var(--sombra),var(--brillo-i);padding:18px;margin-bottom:18px}
.card h2{font-size:18px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:10px}
.card h2 .num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;background:var(--grad);box-shadow:var(--brillo)}
.card h3{font-size:15px;margin:12px 0 6px}
.nota{color:var(--suave);font-size:14px;margin:4px 0 10px}
label.l{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input[type=text],input[type=search],input[type=number],select{width:100%;min-height:48px;border:1.5px solid var(--borde);background:var(--campo);border-radius:14px;padding:8px 14px;transition:border-color .15s,box-shadow .15s;box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
input::placeholder{color:color-mix(in srgb,var(--suave) 80%,transparent)}

    ps[t.dataset.seg] = t.dataset.v; guardar(); return redibujarFicha();
  }
  if (t.dataset.tema !== undefined){ aplicarTema(t.dataset.tema); return dibujarAjustes(); }
  if (t.dataset.ft !== undefined){ filtroTipo = t.dataset.ft; return dibujarLista(); }
  if (id === 'navProductos') return ir('lista');
  if (id === 'navAjustes' || id === 'hPonerNombre') return ir('ajustes');
  if (id === 'bNuevo' || id === 'bNuevoB') return elegirTipo().then(function(tp){ if (tp) nuevoProducto(tp); });
  if (id === 'bCerrarBienv'){ estado.bienvenida = false; guardar(); return dibujarLista(); }
  if (id === 'bBorrarEj'){
    return confirmar('¿Borrar los productos de ejemplo?', 'Borrar', true).then(function(ok){
      if (!ok) return;
      estado.productos = estado.productos.filter(function(p){ return !p.ejemplo; });
      guardar(); dibujarLista();
    });
  }
  if (t.classList.contains('bExp')) return exportar();
  if (t.classList.contains('bImp')) return qs('#archivoImport').click();
  var tarj = t.closest('.prod');
  if (tarj && a){
    var pid = tarj.dataset.id, p = buscarProducto(pid);
    if (a === 'abrir') return ir('ficha', pid);
    if (a === 'dup'){
      var c = JSON.parse(JSON.stringify(p)); c.id = nuevoId(); c.ejemplo = false; c.nombre = (p.nombre || 'Producto') + ' (copia)';
      c.insumos.forEach(function(i){ i.id = nuevoId(); });
      (c.materiales || []).forEach(function(m){ m.id = nuevoId(); });
      estado.productos.splice(estado.productos.indexOf(p) + 1, 0, c); guardar(); dibujarLista(); return aviso('Producto duplicado.');
    }
    if (a === 'del'){
      return confirmar('¿Eliminar "' + (p.nombre || 'Producto sin nombre') + '"? Esto no se puede deshacer.', 'Eliminar', true).then(function(ok){
        if (!ok) return;
        estado.productos = estado.productos.filter(function(x){ return x.id !== pid; }); guardar(); dibujarLista();
      });
    }
  }
  if (id === 'bVolver' || id === 'bVolver2'){ guardarYa(); return ir('lista'); }
  if (id === 'bIrAjustes') return ir('ajustes');
  if (id === 'bInstalar'){ if (promptInstalar){ var pi = promptInstalar; promptInstalar = null; try { pi.prompt(); } catch(x){} dibujarAjustes(); } return; }
  if (id === 'bWa') return enviarPrecioCliente();
  if (id === 'bResumen') return guardarResumen();
  if (id === 'bVerMas'){ var rs = qs('#resultado'); rs.classList.toggle('abierto'); return recalcular(); }
  if (id === 'bAddIns'){
    var p2 = buscarProducto(prodActual); p2.insumos.push(insumoVacio()); guardar();
    qs('#insumos').insertAdjacentHTML('beforeend', filaInsumo(p2.insumos[p2.insumos.length-1], p2.insumos.length-1));
    var nuevos = document.querySelectorAll('#insumos .insumo'); qs('input', nuevos[nuevos.length-1]).focus();
    return recalcular();
  }
  if (a === 'delIns'){
    var fila = t.closest('.insumo'), p3 = buscarProducto(prodActual);
    p3.insumos.splice(+fila.dataset.idx, 1); guardar(); qs('#insumos').innerHTML = p3.insumos.map(filaInsumo).join(''); return recalcular();
  }
  if (id === 'bAddMat'){
    var p4 = buscarProducto(prodActual); p4.materiales.push(matVacio()); guardar();
    qs('#mats').innerHTML = p4.materiales.map(filaMat).join('');
    var ms = document.querySelectorAll('#mats .mat'); qs('input', ms[ms.length-1]).focus();
    return recalcular();
  }
  if (a === 'delMat'){
    var p5 = buscarProducto(prodActual);
    p5.materiales.splice(+t.closest('.mat').dataset.idx, 1); guardar(); qs('#mats').innerHTML = p5.materiales.map(filaMat).join(''); return recalcular();
  }
  if (t.classList.contains('col') && !marcaBloqueada()){ estado.ajustes.color = t.dataset.c; guardar(); aplicarColor(); return dibujarAjustes(); }
  if (id === 'bAddGasto'){
    estado.ajustes.gastosFijos.push({id:nuevoId(), nombre:'', monto:''}); guardar();
    qs('#gastos').innerHTML = estado.ajustes.gastosFijos.map(filaGasto).join(''); resumenFijos();
    var gs = document.querySelectorAll('#gastos .gasto'); return qs('input', gs[gs.length-1]).focus();
  }
  if (a === 'delGasto'){
    estado.ajustes.gastosFijos.splice(+t.closest('.gasto').dataset.idx, 1); guardar();
    qs('#gastos').innerHTML = estado.ajustes.gastosFijos.map(filaGasto).join(''); return resumenFijos();
  }
  if (id === 'bBorrarTodo'){
    return confirmar('Se borrarán TODOS tus productos y ajustes de este dispositivo. Esto no se puede deshacer. ¿Seguro?', 'Borrar todo', true).then(function(ok){
      if (!ok) return;
      estado = {version:2, ajustes:ajustesBase(), productos:[], bienvenida:false, cfgId:(CFG ? CFG.id : '')};
      aplicarConfig(); guardarYa(); refrescarTodo(); ir('lista'); aviso('Datos borrados.');
    });
  }
});
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.id === 'buscador'){ busqueda = el.value; return pintarListaProductos(); }
  if (el.id === 'aColor' && !marcaBloqueada()){ estado.ajustes.color = el.value; guardar(); return aplicarColor(); }
  if (el.dataset.s){
    var k = el.dataset.s;
    if (k === 'negocio' && marcaBloqueada()) return;
    estado.ajustes[k] = (k === 'negocio') ? el.value : aNum(el.value);
    guardar(); aplicarNegocio(); return resumenFijos();
  }
  if (el.dataset.g){
    var g = estado.ajustes.gastosFijos[+el.closest('.gasto').dataset.idx];
    g[el.dataset.g] = el.dataset.g === 'monto' ? aNum(el.value) : el.value;
    guardar(); return resumenFijos();
  }
  if (vista !== 'ficha') return;
  var p = buscarProducto(prodActual); if (!p) return;
  if (el.dataset.k){
    var i = p.insumos[+el.closest('.insumo').dataset.idx], k2 = el.dataset.k;
    if (k2 === 'nombre') i.nombre = el.value;
    else if (k2 === 'uCompra' || k2 === 'uUsada') return;
    else i[k2] = aNum(el.value);
    guardar(); return recalcular();
  }
  if (el.dataset.m){
    var mt = p.materiales[+el.closest('.mat').dataset.idx];
    mt[el.dataset.m] = el.dataset.m === 'monto' ? aNum(el.value) : el.value;
    guardar(); return recalcular();
  }
  var f = el.dataset.f; if (!f) return;
  if (el.type === 'checkbox') p[f] = el.checked;
  else if (CAMPOS_TEXTO[f]) p[f] = el.value;
  else if (f === 'margen' || f === 'recargo'){
    var v = aNum(el.value); if (el.type === 'range') v = +el.value;
    p[f] = v;
    if (el.type === 'range') qs('#fMargen').value = aTexto(v); else qs('#sMargen').value = Math.min(f === 'recargo' ? 200 : 90, Math.max(0, v));
  }
  else if (f === 'valorHora' || f === 'atencionesMes') p[f] = el.value.trim() === '' ? null : aNum(el.value);
  else p[f] = aNum(el.value);
  guardar(); recalcular();
});
document.addEventListener('change', function(e){
  var el = e.target;
  if (el.dataset.k === 'uCompra' || el.dataset.k === 'uUsada'){
    var p = buscarProducto(prodActual), fila = el.closest('.insumo'), i = p.insumos[+fila.dataset.idx];
    i[el.dataset.k] = el.value;
    if (el.dataset.k === 'uCompra' && UNIDADES[i.uUsada].f !== UNIDADES[i.uCompra].f) i.uUsada = el.value;
    guardar(); qs('#insumos').innerHTML = p.insumos.map(filaInsumo).join(''); return recalcular();
  }
  if (el.id === 'archivoImport'){ importar(el.files[0]); el.value = ''; return; }
  if (el.type === 'checkbox' || el.tagName === 'SELECT') return;
});
document.addEventListener('focusout', function(e){
  var el = e.target;
  if (el.dataset && (el.dataset.f === 'margen' || el.dataset.f === 'recargo') && el.type === 'text') el.value = aTexto(buscarProducto(prodActual)[el.dataset.f]);
});
window.addEventListener('pagehide', guardarYa);
document.addEventListener('visibilitychange', function(){ if (document.hidden) guardarYa(); });
function arrancarApp(){
  estado = cargar();
  if (!guardadoOk) document.getElementById('avisoGuardado').style.display = 'block';
  var cid = idConfig();
  if (cid){ CFG = leerCacheConfig(cid); aplicarConfig(); }
  aplicarLogo();
  aplicarColor();
  aplicarNegocio();
  ir('lista');
  if (cid) descargarConfig(cid);
  try { if (!localStorage.getItem(CLAVE)) guardarYa(); } catch(e){ guardadoOk = false; document.getElementById('avisoGuardado').style.display = 'block'; }
}
Activacion.iniciar(arrancarApp);
var promptInstalar = null;
function redibujarAjustesSiAbierto(){ try { if (qs('#vAjustes').classList.contains('act')) dibujarAjustes(); } catch(x){} }
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); promptInstalar = e; redibujarAjustesSiAbierto(); });
window.addEventListener('appinstalled', function(){ promptInstalar = null; redibujarAjustesSiAbierto(); });
window.addEventListener('load', function(){
  try {
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  } catch(e){}
});
</script>
</body>
